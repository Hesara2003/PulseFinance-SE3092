name: Firestore Rules Tests

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore-rules-tests/**'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

jobs:
  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: firestore-rules-tests
        run: npm install --no-audit --no-fund

      - name: Run rules tests against the Firestore emulator
        run: npx --yes firebase-tools@13 emulators:exec --only firestore --project demo-pulsefinance "cd firestore-rules-tests && npm test"
