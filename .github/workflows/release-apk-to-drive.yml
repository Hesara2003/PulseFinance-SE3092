name: Release APK & Bundle to Google Drive

on:
  # Trigger when a GitHub Release is published
  release:
    types: [published]

  # Trigger when code is pushed to main or when release tags are pushed
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.0.0'       # Major releases (v1.0.0, v2.0.0, etc.)
      - 'v[0-9]+.[0-9]+.[0-9]+' # Any semantic version release tag

  # Allow manual trigger from GitHub Actions tab for testing or ad-hoc builds
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      bundle_aab:
        description: 'Also build and upload Android App Bundle (.aab)?'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build & Upload APK to Google Drive
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Google Drive Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: 🏷️ Determine Release Version
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="1.0.0"
          fi
          # Strip leading 'v' if present for clean artifact names
          CLEAN_VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "Building PulseFinance Version: $VERSION (Clean: $CLEAN_VERSION)"

      - name: 🔑 Restore Firebase google-services.json (if secret present)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Successfully restored google-services.json from secret."
          else
            echo "Using bundled repository app/google-services.json."
          fi

      - name: 🔨 Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: 🔐 Restore release keystore
        if: ${{ (github.event.inputs.build_type || 'release') == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # One permanent key for every release. A new key per run makes each APK
          # impossible to install over the last one, and Google sign-in needs a stable SHA-1.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing, so the release APK cannot be signed. See docs/RELEASE_WORKFLOW_AND_GDRIVE.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 🚀 Build APK (${{ github.event.inputs.build_type || 'release' }})
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: ✅ Verify the APK is signed
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          SRC_APK=$(find "app/build/outputs/apk/$BUILD_TYPE" -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "::error::No signed APK was produced in app/build/outputs/apk/$BUILD_TYPE."
            ls -la "app/build/outputs/apk/$BUILD_TYPE" || true
            exit 1
          fi
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          # Fails the job, so an APK Android would refuse never reaches Google Drive.
          "$BUILD_TOOLS/apksigner" verify --print-certs "$SRC_APK"

          FINAL_APK="app/build/outputs/apk/release/PulseFinance-v${{ env.CLEAN_VERSION }}.apk"
          mkdir -p "$(dirname "$FINAL_APK")"
          [ "$SRC_APK" -ef "$FINAL_APK" ] || cp "$SRC_APK" "$FINAL_APK"
          echo "APK_PATH=$FINAL_APK" >> "$GITHUB_ENV"
          ls -lh "$FINAL_APK"

      - name: 📦 Build Android App Bundle (AAB)
        if: ${{ github.event.inputs.bundle_aab != false }}
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon || true
          AAB_FILE=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ] && [ -f "$AAB_FILE" ]; then
            FINAL_AAB="app/build/outputs/bundle/release/PulseFinance-v${{ env.CLEAN_VERSION }}.aab"
            mkdir -p "app/build/outputs/bundle/release"
            cp "$AAB_FILE" "$FINAL_AAB"
            echo "AAB_PATH=$FINAL_AAB" >> $GITHUB_ENV
            echo "Found AAB at: $FINAL_AAB"
          fi

      - name: ☁️ Upload APK to Google Drive
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: "1GRAAyZV_luvfbuwS06Pa01GojCZQkg7d"
        run: |
          if [ -z "$GDRIVE_REFRESH_TOKEN" ] && [ -z "$GDRIVE_SA_KEY" ]; then
            echo "::warning::Neither GDRIVE_REFRESH_TOKEN nor GDRIVE_SA_KEY secret is configured. Skipping Google Drive upload step."
            echo "See docs/RELEASE_WORKFLOW_AND_GDRIVE.md for setup instructions."
          else
            echo "Uploading APK to Google Drive folder 1GRAAyZV_luvfbuwS06Pa01GojCZQkg7d..."
            python scripts/upload_to_gdrive.py \
              --file "${{ env.APK_PATH }}" \
              --folder-id "1GRAAyZV_luvfbuwS06Pa01GojCZQkg7d" \
              --name "PulseFinance-v${{ env.CLEAN_VERSION }}.apk"

            if [ -n "${{ env.AAB_PATH }}" ] && [ -f "${{ env.AAB_PATH }}" ]; then
              echo "Uploading AAB bundle to Google Drive folder..."
              python scripts/upload_to_gdrive.py \
                --file "${{ env.AAB_PATH }}" \
                --folder-id "1GRAAyZV_luvfbuwS06Pa01GojCZQkg7d" \
                --name "PulseFinance-v${{ env.CLEAN_VERSION }}.aab"
            fi
          fi

      - name: 💾 Upload Artifacts to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: PulseFinance-v${{ env.CLEAN_VERSION }}-build
          path: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
          retention-days: 30

      - name: 🏷️ Attach APK to GitHub Release (if release or tag trigger)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
