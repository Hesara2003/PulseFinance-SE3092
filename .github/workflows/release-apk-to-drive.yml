name: Release APK & Bundle to Google Drive

on:
  # Trigger when a GitHub Release is published
  release:
    types: [published]

  # Trigger when code is pushed to main or when release tags are pushed
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.0.0'       # Major releases (v1.0.0, v2.0.0, etc.)
      - 'v[0-9]+.[0-9]+.[0-9]+' # Any semantic version release tag

  # Allow manual trigger from GitHub Actions tab for testing or ad-hoc builds
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      bundle_aab:
        description: 'Also build and upload Android App Bundle (.aab)?'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build & Upload APK to Google Drive
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Google Drive Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: 🏷️ Determine Release Version
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="1.0.0"
          fi
          # Strip leading 'v' if present for clean artifact names
          CLEAN_VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "Building PulseFinance Version: $VERSION (Clean: $CLEAN_VERSION)"

      - name: 🔑 Restore Firebase google-services.json (if secret present)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Successfully restored google-services.json from secret."
          else
            echo "Using bundled repository app/google-services.json."
          fi

      - name: 🔨 Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: 🚀 Build APK (${{ github.event.inputs.build_type || 'release' }})
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: ✍️ Sign Release APK (if Keystore Secret Available or Self-Sign for Testing)
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          APK_DIR="app/build/outputs/apk/$BUILD_TYPE"
          
          if [ "$BUILD_TYPE" = "debug" ]; then
            SRC_APK=$(find "$APK_DIR" -name "*.apk" | head -n 1)
            FINAL_APK="app/build/outputs/apk/release/PulseFinance-v${{ env.CLEAN_VERSION }}.apk"
            mkdir -p "app/build/outputs/apk/release"
            cp "$SRC_APK" "$FINAL_APK"
            echo "APK_PATH=$FINAL_APK" >> $GITHUB_ENV
          else
            # Release build signing logic
            UNSIGNED_APK=$(find "$APK_DIR" -name "*unsigned.apk" -o -name "*release*.apk" | head -n 1)
            FINAL_APK="$APK_DIR/PulseFinance-v${{ env.CLEAN_VERSION }}.apk"
            
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "Signing APK with provided production keystore secret..."
              echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
              zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk || cp "$UNSIGNED_APK" aligned.apk
              apksigner sign --ks release.keystore --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --key-pass "pass:$KEY_PASSWORD" --ks-key-alias "$KEY_ALIAS" \
                --out "$FINAL_APK" aligned.apk
            else
              echo "No production keystore secret provided. Signing with CI test key to ensure APK is installable..."
              keytool -genkey -v -keystore test.keystore -alias testKey -keyalg RSA -keysize 2048 \
                -validity 10000 -storepass pulsefinance -keypass pulsefinance \
                -dname "CN=PulseFinance, OU=Mobile, O=PulseFinance, L=Colombo, C=LK"
              apksigner sign --ks test.keystore --ks-pass pass:pulsefinance \
                --key-pass pass:pulsefinance --ks-key-alias testKey \
                --out "$FINAL_APK" "$UNSIGNED_APK" || cp "$UNSIGNED_APK" "$FINAL_APK"
            fi
            echo "APK_PATH=$FINAL_APK" >> $GITHUB_ENV
          fi
          
          echo "Verified APK at: $FINAL_APK"
          ls -lh "$FINAL_APK"

      - name: 📦 Build Android App Bundle (AAB)
        if: ${{ github.event.inputs.bundle_aab != false }}
        run: |
          ./gradlew bundleRelease --no-daemon || true
          AAB_FILE=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ] && [ -f "$AAB_FILE" ]; then
            FINAL_AAB="app/build/outputs/bundle/release/PulseFinance-v${{ env.CLEAN_VERSION }}.aab"
            mkdir -p "app/build/outputs/bundle/release"
            cp "$AAB_FILE" "$FINAL_AAB"
            echo "AAB_PATH=$FINAL_AAB" >> $GITHUB_ENV
            echo "Found AAB at: $FINAL_AAB"
          fi

      - name: ☁️ Upload APK to Google Drive
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: "1GRAAyZV_luvfbuwS06Pa01GojCZQkg7d"
        run: |
          if [ -z "$GDRIVE_REFRESH_TOKEN" ] && [ -z "$GDRIVE_SA_KEY" ]; then
            echo "::warning::Neither GDRIVE_REFRESH_TOKEN nor GDRIVE_SA_KEY secret is configured. Skipping Google Drive upload step."
            echo "See docs/RELEASE_WORKFLOW_AND_GDRIVE.md for setup instructions."
          else
            echo "Uploading APK to Google Drive folder 1GRAAyZV_luvfbuwS06Pa01GojCZQkg7d..."
            python scripts/upload_to_gdrive.py \
              --file "${{ env.APK_PATH }}" \
              --folder-id "1GRAAyZV_luvfbuwS06Pa01GojCZQkg7d" \
              --name "PulseFinance-v${{ env.CLEAN_VERSION }}.apk"

            if [ -n "${{ env.AAB_PATH }}" ] && [ -f "${{ env.AAB_PATH }}" ]; then
              echo "Uploading AAB bundle to Google Drive folder..."
              python scripts/upload_to_gdrive.py \
                --file "${{ env.AAB_PATH }}" \
                --folder-id "1GRAAyZV_luvfbuwS06Pa01GojCZQkg7d" \
                --name "PulseFinance-v${{ env.CLEAN_VERSION }}.aab"
            fi
          fi

      - name: 💾 Upload Artifacts to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: PulseFinance-v${{ env.CLEAN_VERSION }}-build
          path: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
          retention-days: 30

      - name: 🏷️ Attach APK to GitHub Release (if release or tag trigger)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
